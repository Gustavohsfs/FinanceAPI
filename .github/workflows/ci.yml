name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fluxo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: '3000'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fluxo_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fluxo_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SECRET_CURRENT: ci-access-secret-with-at-least-32-characters
      REFRESH_TOKEN_PEPPER: ci-refresh-secret-with-at-least-32-characters
      CORS_ORIGINS: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:validate
      - run: pnpm prisma:drift
      - run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm build:check
      - run: pnpm openapi:generate
      - run: git diff --exit-code -- docs/openapi.json
